name: leafpad
version: '0.8.18.1'
summary: GTK+ based simple text editor
description: |
 Leafpad is a simple GTK+ based text editor with user interface
 similar to Notepad. It aims to be lighter than Gedit and KWrite,
 and to be as useful as them.

grade: stable
confinement: strict
base: core24
platforms:
  amd64:
  arm64:
  armhf:

plugs:
  gtk-2-engines:
    interface: content
    target: $SNAP/lib/gtk-2.0
    default-provider: gtk2-common-themes
  gtk-2-themes:
    interface: content
    target: $SNAP/share/themes
    default-provider: gtk2-common-themes
  icon-themes:
    interface: content
    target: $SNAP/share/icons
    default-provider: gtk-common-themes

environment:
  GTK_PATH: $SNAP/lib/gtk-2.0
  GTK_DATA_PREFIX: $SNAP
  XDG_DATA_DIRS: $SNAP/share:$XDG_DATA_DIRS

apps:
  leafpad:
    command: bin/desktop-launch leafpad
    plugs:
      - avahi-observe
      - cups-control
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - network
      - mount-observe
      - removable-media
      - x11
    desktop: usr/share/applications/leafpad.desktop

parts:
  desktop-gtk2:
    source: https://github.com/ubuntu/snapcraft-desktop-helpers.git
    source-subdir: gtk
    plugin: make
    make-parameters: ["FLAVOR=gtk2"]
    build-packages:
      - libgtk2.0-dev
    stage-packages:
      - libxkbcommon0  # XKB_CONFIG_ROOT
      - shared-mime-info
      - libgdk-pixbuf2.0-0
      - libglib2.0-bin
      - libgtk2.0-bin
      - libgtk2.0-0t64
      - locales-all
      - xdg-user-dirs
    prime:
      - -usr/lib/*/libgdk_pixbuf_xlib-2.0.so*
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicui18n.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
      - -usr/lib/*/libxkbcommon.so*
      - -usr/share/doc*
      - -usr/share/icons
    override-build: |
      craftctl default
      sed -i.bak -e 's|libgtk2.0-0|libgtk2.0-0t64|g' $CRAFT_PART_INSTALL/bin/desktop-launch
        
  leafpad:
    after: [desktop-gtk2]
    plugin: autotools
    source: leafpad-0.8.18.1.tar.gz
    autotools-configure-parameters: [--prefix=/usr]
    override-build: |
      sed -i.bak -e 's|Icon=leafpad$|Icon=${SNAP}/meta/gui/leafpad.svg|g' data/leafpad.desktop.in
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/meta/gui/
      cp ../src/data/icons/scalable/leafpad.svg $CRAFT_PART_INSTALL/meta/gui/
      cp data/leafpad.desktop $CRAFT_PART_INSTALL/meta/gui/
    build-packages:
      - intltool
      - libgtk2.0-dev
      - pkg-config
